<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />

	<!-- Favicon -->
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />

	<!-- Performance -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

	<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">

	<!-- Viewport -->
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Primary SEO -->
	<title>Gidi Tour - Authentic Travel Experiences in Africa & Beyond</title>

	<meta name="description"
		content="Discover authentic tours, cultural experiences, food, history and unforgettable adventures across Nigeria, Ghana, Kenya, Tanzania, Rwanda, Egypt, Morocco, South Africa and the UK with Gidi Tour." />

	<meta name="keywords"
		content="Gidi Tour, Africa tours, African travel, Nigeria tours, Lagos tours, Ghana tours, Kenya tours, Tanzania tours, Rwanda tours, Egypt tours, Morocco tours, South Africa tours, UK tours, cultural experiences, African travel experiences, private tours, group tours" />

	<meta name="author" content="Gidi Tour" />
	<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

	<!-- Canonical -->
	<link rel="canonical" href="https://giditour.com/" />

	<!-- Theme -->
	<meta name="theme-color" content="#0D0D0D" />
	<meta name="color-scheme" content="dark light" />

	<!-- Language -->
	<link rel="alternate" hreflang="en" href="https://giditour.com/" />
	<link rel="alternate" hreflang="x-default" href="https://giditour.com/" />

	<!-- Open Graph / Facebook / WhatsApp -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Gidi Tour" />
	<meta property="og:title" content="Gidi Tour - Authentic Travel Experiences in Africa & Beyond" />

	<meta property="og:description"
		content="Explore authentic tours, cultural experiences, food, history and unforgettable journeys across Africa and the UK." />

	<meta property="og:url" content="https://giditour.com/" />
	<meta property="og:locale" content="en_US" />

	<!--  Gidi Tour social sharing image -->
	<meta property="og:image" content="https://res.cloudinary.com/du8ocxxu1/image/upload/v1787983116/tour_acdwyc.png" />

	<meta property="og:image:alt" content="Gidi Tour travel experience" />

	<!-- X / Twitter -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Gidi Tour - Authentic Travel Experiences in Africa & Beyond" />

	<meta name="twitter:description"
		content="Discover authentic travel experiences, tours and unforgettable journeys across Africa and the UK." />

	<meta name="twitter:image"
		content="https://res.cloudinary.com/du8ocxxu1/image/upload/v1787983116/tour_acdwyc.png" />

	<meta name="twitter:image:alt" content="Gidi Tour travel experience" />

	<!-- Web App Manifest -->
	<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

	<!--
			Structured Data / AEO

			This helps search engines and AI-powered search systems
			understand what Gidi Tour is and what the website provides.
		-->

	<script src="https://js.paystack.co/v1/inline.js"></script>
	<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "TravelAgency",
						"@id": "https://giditour.com/#organization",
						"name": "Gidi Tour",
						"url": "https://giditour.com/",
						"logo": {
							"@type": "ImageObject",
							"url": "https://giditour.com/logo.png"
						},
						"description": "Gidi Tour provides authentic travel experiences, cultural tours, food experiences, adventures and guided journeys across Africa and the UK.",
						"areaServed": [
							"NG",
							"GH",
							"KE",
							"TZ",
							"RW",
							"EG",
							"MA",
							"ZA",
							"GB"
						],
						"sameAs": [
							"https://www.instagram.com/giditour"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://giditour.com/#website",
						"url": "https://giditour.com/",
						"name": "Gidi Tour",
						"description": "Authentic tours and travel experiences across Africa and the UK.",
						"publisher": {
							"@id": "https://giditour.com/#organization"
						},
						"inLanguage": "en"
					}
				]
			}
		</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
